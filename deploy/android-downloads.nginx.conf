# Stable downloads must never reuse a cached response across releases.
location = /downloads/android/bansheng-latest.apk {
    alias /mnt/datadisk0/companion/downloads/android/bansheng-latest.apk;
    limit_except GET { deny all; }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="bansheng-latest.apk"' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    open_file_cache off;
    etag off;
    if_modified_since off;
}

# Include inside the existing banshengcomp.com HTTPS server block.
# Public downloads live on the data disk, outside Web deployments and API media.
location ^~ /downloads/android/ {
    alias /mnt/datadisk0/companion/downloads/android/;
    autoindex off;
    limit_except GET { deny all; }
    types {
        application/vnd.android.package-archive apk;
        text/plain sha256;
        image/svg+xml svg;
        application/json json;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}
