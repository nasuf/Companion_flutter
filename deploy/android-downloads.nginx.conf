# Include inside the existing banshengcomp.com HTTPS server block.
# Public downloads live on the data disk, outside Web deployments and API media.
location ^~ /downloads/android/ {
    alias /mnt/datadisk0/companion/downloads/android/;
    autoindex off;
    limit_except GET { deny all; }
    types {
        application/vnd.android.package-archive apk;
        text/plain sha256;
        image/svg+xml svg;
        application/json json;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}
